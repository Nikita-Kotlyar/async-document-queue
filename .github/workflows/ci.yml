name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus
      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Unit and API tests
        env:
          PYTHONIOENCODING: utf-8
        run: >
          .venv/bin/python -m pytest -q
          --timeout=60 --timeout-method=thread
          -m "not integration"
          --cov=app --cov=webhook_sink --cov-fail-under=75

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Prepare CI environment
        run: |
          cat > .env <<EOF
          ADQ_ENVIRONMENT=ci
          POSTGRES_USER=adq
          POSTGRES_DB=adq
          POSTGRES_PASSWORD=ci-postgres-placeholder
          RABBITMQ_DEFAULT_USER=adq
          RABBITMQ_DEFAULT_PASS=ci-rabbitmq-placeholder
          ADQ_DATABASE_URL=postgresql+asyncpg://adq:ci-postgres-placeholder@db:5432/adq
          ADQ_SYNC_DATABASE_URL=postgresql+psycopg://adq:ci-postgres-placeholder@db:5432/adq
          ADQ_REDIS_URL=redis://redis:6379/0
          ADQ_BROKER_URL=amqp://adq:ci-rabbitmq-placeholder@rabbitmq:5672//
          ADQ_WEBHOOK_SECRET=${{ secrets.CI_WEBHOOK_SECRET || 'ci-webhook-secret' }}
          ADQ_API_KEY=
          EOF
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d db redis rabbitmq api worker beat webhook-sink
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Seed webhook endpoint
        run: >
          docker compose exec -T api adq seed-webhook
          --url http://webhook-sink:8090/hooks/documents
          --secret "${{ secrets.CI_WEBHOOK_SECRET || 'ci-webhook-secret' }}"
      - name: Integration tests
        env:
          ADQ_INTEGRATION: "1"
          ADQ_API_URL: http://localhost:8081
          PYTHONIOENCODING: utf-8
        run: .venv/bin/python -m pytest -v -m integration --timeout=60 --timeout-method=thread
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
