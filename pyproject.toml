[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "async-document-queue"
version = "0.1.0"
description = "Reliable asynchronous document intake: FastAPI, Celery, RabbitMQ, Redis, PostgreSQL, webhooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nikita" }]
keywords = ["fastapi", "celery", "rabbitmq", "redis", "postgresql", "webhooks", "document-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "pypdf>=4.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "ruff>=0.5",
]

[project.scripts]
adq = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "webhook_sink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
timeout = 60
timeout_method = "thread"
markers = [
    "integration: tests that need PostgreSQL, Redis and RabbitMQ",
    "ocr: tests that need the Tesseract binary",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["app", "webhook_sink"]
omit = ["app/cli.py", "app/workers/*"]

[tool.coverage.report]
show_missing = true
fail_under = 75
